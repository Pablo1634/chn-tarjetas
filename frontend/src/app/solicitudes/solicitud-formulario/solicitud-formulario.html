<section class="pagina-formulario">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Nueva solicitud de tarjeta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="guardar()">
        <mat-form-field appearance="outline">
          <mat-label>ID del cliente</mat-label>
          <input
            matInput
            type="number"
            name="clienteId"
            [(ngModel)]="clienteId"
            min="1"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo de tarjeta</mat-label>
          <mat-select
            name="tipoTarjeta"
            [(ngModel)]="tipoTarjeta"
            required
          >
            <mat-option value="CLASICA">Clásica</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Ingreso mensual declarado (Q)</mat-label>
          <input
            matInput
            type="number"
            name="ingresoMensualDeclarado"
            [(ngModel)]="ingresoMensualDeclarado"
            min="0.01"
            step="0.01"
            required
          />
        </mat-form-field>

        @if (mensaje) {
          <p class="mensaje">{{ mensaje }}</p>
        }

        <div class="acciones">
          <button
            mat-raised-button
            type="button"
            (click)="router.navigate(['/solicitudes'])"
          >
            Cancelar
          </button>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="guardando"
          >
            {{ guardando ? 'Guardando...' : 'Registrar solicitud' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
