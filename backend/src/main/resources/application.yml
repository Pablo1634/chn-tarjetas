spring:
  application:
    name: chn-cards
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=chn_cards;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true